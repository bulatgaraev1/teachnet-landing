<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Пример фирменного электронного значка</title><desc id="desc">Иллюстрация голубого печатного значка с надписью «ВАШ БРЕНД» и подсветкой.</desc>
<defs>
<linearGradient id="face" x1="151" y1="136" x2="454" y2="389" gradientUnits="userSpaceOnUse"><stop stop-color="#E6EEF8"/><stop offset="1" stop-color="#A7BADA"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#316397"/><stop offset="1" stop-color="#18222F"/></linearGradient>
<linearGradient id="silver"><stop stop-color="#F5F8FC"/><stop offset=".5" stop-color="#8896A6"/><stop offset="1" stop-color="#E6EEF8"/></linearGradient>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="10" dy="28" stdDeviation="25" flood-color="#0E1A28" flood-opacity=".5"/></filter>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<g transform="rotate(-12 330 270)" filter="url(#shadow)">
