<text x="330" y="401" text-anchor="middle" fill="#316397" font-family="Arial,Helvetica,sans-serif" font-size="8" letter-spacing="2">СВЕТЯЩИЙСЯ ЗНАЧОК / ПРИМЕР ДИЗАЙНА</text>
