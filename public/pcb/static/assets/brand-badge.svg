<rect x="138" y="106" width="384" height="320" rx="70" fill="url(#face)" stroke="#F5F8FC" stroke-width="2"/>
<rect x="152" y="120" width="356" height="292" rx="57" stroke="#6E8DAF" stroke-width="1.5"/>
<g stroke="#316397" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M174 236H199V186H248V152H302M486 236H463V186H410V152H358M174 293H196V348H255V384H287M486 293H463V348H409V384H374"/><path d="M214 144V166H234M446 144V166H426M170 265H201M461 265H490M300 353V328M360 353V328"/></g>
