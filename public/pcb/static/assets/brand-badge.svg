<g><circle cx="176" cy="179" r="8" fill="#D9A441"/><circle cx="176" cy="179" r="4" fill="#18222F"/><circle cx="484" cy="179" r="8" fill="#D9A441"/><circle cx="484" cy="179" r="4" fill="#18222F"/><circle cx="176" cy="353" r="8" fill="#D9A441"/><circle cx="176" cy="353" r="4" fill="#18222F"/><circle cx="484" cy="353" r="8" fill="#D9A441"/><circle cx="484" cy="353" r="4" fill="#18222F"/></g>

<text x="330" y="281" text-anchor="middle" fill="#316397" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="12" letter-spacing="3">ВКЛЮЧАЕТ ИНТЕРЕС</text>
<g transform="translate(330 350)"><rect x="-46" y="-17" width="92" height="34" rx="5" fill="#6E8DAF"/><rect x="-50" y="-8" width="100" height="16" fill="url(#silver)"/><rect x="-40" y="-16" width="80" height="30" rx="3" fill="#f8edd0"/><rect x="-34" y="-12" width="68" height="23" rx="2" fill="#fff4a4"/><rect x="-34" y="-12" width="68" height="23" rx="2" fill="#fff4a4" filter="url(#glow)"/><path d="M-22-7V5M0-7V5M22-7V5" stroke="#fffdef" stroke-width="13"/></g>
