    <g transform="translate(166 328) rotate(90)"><use href="#capacitor"/></g><g transform="translate(508 328) rotate(90)"><use href="#capacitor"/></g>
    <path d="M286 416V431H306M368 431H389V416" stroke="#E6EEF8" stroke-width="5" stroke-linecap="square"/>
    <circle cx="337" cy="164" r="5" fill="#E6EEF8"/>
