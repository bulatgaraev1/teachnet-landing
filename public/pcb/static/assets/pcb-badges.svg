    <g fill="#B9CBE2" font-family="Arial,Helvetica,sans-serif" font-size="8" letter-spacing="1"><text x="278" y="260">D1</text><text x="400" y="260">D2</text><text x="258" y="390">R1</text><text x="405" y="390">R2</text><text x="307" y="449">Q1</text><text x="227" y="227">01 / LIGHT BOT</text><text x="420" y="470">3V</text></g>
    <use href="#hole" x="220" y="252"/><use href="#hole" x="453" y="252"/><use href="#hole" x="220" y="451"/><use href="#hole" x="452" y="451"/>
    <circle cx="280" cy="300" r="64" fill="url(#light)"/>
    <circle cx="402" cy="300" r="64" fill="url(#light)"/>
