  <!-- A second, sculpted lightning-shaped PCB pin. -->
  <g transform="rotate(17 626 471)" filter="url(#softShadow)">
    <path d="M613 325H711L665 422H728L571 603L599 486H544Z" transform="translate(0 7)" fill="#153C80" stroke="#A7BADA" stroke-width="1.5"/>
