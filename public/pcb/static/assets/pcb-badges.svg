<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 700" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Дизайн светящихся значков из печатных плат</title>
  <desc id="desc">Иллюстрация трёх значков: тёмно-синего робота с двумя светодиодами, синей молнии и круглого фирменного значка.</desc>
  <defs>
    <linearGradient id="green" x1="172" y1="161" x2="519" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#316397"/><stop offset=".48" stop-color="#183B67"/><stop offset="1" stop-color="#0E1A28"/></linearGradient>
    <linearGradient id="gold" x1="125" y1="198" x2="532" y2="478" gradientUnits="userSpaceOnUse"><stop stop-color="#f2d792"/><stop offset=".5" stop-color="#af873f"/><stop offset="1" stop-color="#dcc488"/></linearGradient>
    <linearGradient id="orange" x1="557" y1="359" x2="709" y2="590" gradientUnits="userSpaceOnUse"><stop stop-color="#377EE9"/><stop offset=".48" stop-color="#1055CB"/><stop offset="1" stop-color="#153C80"/></linearGradient>
    <linearGradient id="purple" x1="565" y1="97" x2="729" y2="278" gradientUnits="userSpaceOnUse"><stop stop-color="#F5F8FC"/><stop offset="1" stop-color="#A7BADA"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#fffef0" stop-opacity=".98"/><stop offset=".25" stop-color="#ffe690" stop-opacity=".55"/><stop offset="1" stop-color="#ffe781" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal"><stop stop-color="#F5F8FC"/><stop offset=".3" stop-color="#8896A6"/><stop offset=".55" stop-color="#E6EEF8"/><stop offset="1" stop-color="#7F8D9B"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="210%"><feDropShadow dx="5" dy="30" stdDeviation="22" flood-color="#18222F" flood-opacity=".2"/><feDropShadow dx="2" dy="5" stdDeviation="2" flood-color="#18222F" flood-opacity=".24"/></filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="3" dy="18" stdDeviation="14" flood-color="#18222F" flood-opacity=".17"/></filter>
    <filter id="ledGlow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="resistor"><rect x="-21" y="-9" width="42" height="18" rx="3" fill="#0E1A28" fill-opacity=".7"/><rect x="-18" y="-8" width="36" height="14" rx="2" fill="url(#metal)"/><rect x="-10" y="-8" width="20" height="14" rx="1" fill="#18222F"/><text x="0" y="2" text-anchor="middle" fill="#e1ded0" font-family="Arial,sans-serif" font-size="6">221</text></g>
    <g id="capacitor"><rect x="-14" y="-7" width="28" height="14" rx="2" fill="url(#metal)"/><rect x="-8" y="-7" width="16" height="14" fill="#bd9876"/><path d="M-7-6H6" stroke="#e5c5a5" stroke-width="2"/></g>
    <g id="hole"><circle r="8" fill="url(#gold)"/><circle r="4.7" fill="#0E1A28"/><path d="M-3 2A4 4 0 0 0 4-1" stroke="#6A83A1" stroke-width="1.5"/></g>
    <g id="led"><rect x="-18" y="-15" width="36" height="30" rx="3" fill="#0E1A28"/><path d="M-22-6H22V6H-22Z" fill="url(#metal)"/><rect x="-15" y="-14" width="30" height="25" rx="3" fill="#d9c675"/><rect x="-12" y="-12" width="24" height="21" rx="2" fill="#fff4ad"/><rect x="-7" y="-7" width="14" height="12" rx="1" fill="#fffef2"/><rect x="-12" y="-12" width="24" height="21" fill="#ffe587" filter="url(#ledGlow)"/></g>
  </defs>
