name: Deploy to reg.ru
on:
  push:
    branches: [main]
  workflow_dispatch:
# токену GitHub в этом процессе нужно только чтение кода
permissions:
  contents: read
# два деплоя подряд не идут одновременно (иначе путается синхронизация FTP)
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # действие закреплено по коммиту (тег можно перевесить); FTPS — пароль не идёт открытым текстом
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          protocol: ftps
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
      # IndexNow: сообщаем Яндексу (и через него — другим поисковикам протокола) об обновлении страниц.
      # Ключ — публичный файл public/b887174e966bb3311dbb16685f6fabe3.txt, это не секрет. Сбой здесь деплой не ломает.
      - name: IndexNow
        continue-on-error: true
        run: |
          curl -sS -m 30 -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"teachnet.ru","key":"b887174e966bb3311dbb16685f6fabe3","keyLocation":"https://teachnet.ru/b887174e966bb3311dbb16685f6fabe3.txt","urlList":["https://teachnet.ru/","https://teachnet.ru/electronics","https://teachnet.ru/tech","https://teachnet.ru/child"]}'
